{% load static %}
<!-- Rentora Odisha City & Hub Switcher Modal / Bottom Sheet -->
<div id="city-modal-overlay" class="sheet-backdrop fixed inset-0 z-[110] bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300" onclick="closeCityModal()"></div>

<div id="city-modal-sheet" class="sheet-panel fixed bottom-0 inset-x-0 max-w-2xl mx-auto z-[120] hidden bg-white dark:bg-zinc-900 rounded-t-[2rem] sm:rounded-[2rem] sm:bottom-auto sm:top-1/2 sm:-translate-y-1/2 p-6 sm:p-8 shadow-2xl border border-slate-200/80 dark:border-zinc-800 translate-y-full sm:translate-y-[-40%] transition-all duration-300 ease-out max-h-[90vh] flex flex-col">
    <!-- Mobile Drag Handle -->
    <div class="sm:hidden w-12 h-1.5 bg-slate-300 dark:bg-zinc-700 rounded-full mx-auto mb-4 shrink-0 cursor-pointer" onclick="closeCityModal()"></div>

    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
        <div>
            <div class="flex items-center gap-1.5 mb-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[11px] font-bold uppercase tracking-[0.2em] text-[#FF5F00]">Odisha Mobility Network</span>
            </div>
            <h3 class="text-xl sm:text-2xl font-black font-headline text-slate-900 dark:text-white">Choose Your City in Odisha</h3>
            <p class="text-xs text-slate-500 dark:text-zinc-400 mt-0.5">Self-drive delivery to your doorstep, airport terminal, or local hub</p>
        </div>
        <button onclick="closeCityModal()" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-zinc-800 flex items-center justify-center text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white transition-colors" aria-label="Close modal">
            <span class="material-symbols-outlined text-lg">close</span>
        </button>
    </div>

    <!-- Quick Airport & Express Hub Badges -->
    <div class="mb-4 p-3 rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200/60 dark:border-amber-900/40 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-[#FF5F00] text-white flex items-center justify-center shrink-0 shadow-sm">
                <span class="material-symbols-outlined text-lg">flight_takeoff</span>
            </div>
            <div>
                <p class="text-xs font-black text-slate-900 dark:text-amber-100">Biju Patnaik Int'l Airport (BBI)</p>
                <p class="text-[10px] text-slate-600 dark:text-amber-300/80 font-medium">Terminal 1 & 2 curbside handover • Zero wait</p>
            </div>
        </div>
        <button type="button" onclick="selectCity('Bhubaneswar', 'BBI Airport, Bhubaneswar')" class="px-3 py-1.5 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold hover:bg-[#FF5F00] transition-colors shrink-0">
            Select BBI
        </button>
    </div>

    <!-- Search Input -->
    <div class="relative mb-4">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
        <input type="text" id="city-search-box" placeholder="Search city (Bhubaneswar, Cuttack, Puri, Rourkela...)" oninput="filterCityList(this.value)" class="w-full bg-slate-50 dark:bg-zinc-800/80 border border-slate-200 dark:border-zinc-700 rounded-2xl py-3 pl-11 pr-4 text-xs font-semibold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-[#FF5F00] transition-all" />
    </div>

    <!-- Cities Grid -->
    <div class="overflow-y-auto flex-1 custom-scrollbar pr-1 -mr-1">
        <p class="text-[11px] font-bold uppercase tracking-[0.18em] text-slate-400 dark:text-zinc-500 mb-2.5">Primary Operational Cities</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="city-items-grid">
            
            <!-- Bhubaneswar (Default & Capital Hub) -->
            <button type="button" onclick="selectCity('Bhubaneswar', 'Patia, Bhubaneswar')" class="city-item flex items-center gap-3.5 p-3.5 rounded-2xl border-2 border-[#FF5F00]/30 bg-amber-500/5 hover:border-[#FF5F00] transition-all text-left group relative overflow-hidden">
                <div class="w-11 h-11 rounded-2xl bg-[#FF5F00]/10 text-[#FF5F00] flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined text-2xl font-bold">location_city</span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2">
                        <h4 class="text-sm font-black text-slate-900 dark:text-white group-hover:text-[#FF5F00] transition-colors">Bhubaneswar (BBSR)</h4>
                        <span class="px-1.5 py-0.5 rounded text-[9px] font-extrabold bg-[#FF5F00] text-white">Default Hub</span>
                    </div>
                    <p class="text-[11px] text-slate-500 dark:text-zinc-400 font-medium truncate">BBI Airport • Patia • Saheed Nagar • Khandagiri</p>
                    <p class="text-[10px] text-emerald-600 dark:text-emerald-400 font-bold mt-0.5">45+ Cars Available • Instant Handover</p>
                </div>
            </button>

            <!-- Cuttack -->
            <button type="button" onclick="selectCity('Cuttack', 'Badambadi, Cuttack')" class="city-item flex items-center gap-3.5 p-3.5 rounded-2xl border border-slate-200 dark:border-zinc-800 bg-slate-50/50 dark:bg-zinc-800/40 hover:border-[#FF5F00] transition-all text-left group">
                <div class="w-11 h-11 rounded-2xl bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined text-2xl">apartment</span>
                </div>
                <div class="flex-1 min-w-0">
                    <h4 class="text-sm font-black text-slate-900 dark:text-white group-hover:text-[#FF5F00] transition-colors">Cuttack</h4>
                    <p class="text-[11px] text-slate-500 dark:text-zinc-400 font-medium truncate">Badambadi • CDA Sec 9 • Link Road • OMP</p>
                    <p class="text-[10px] text-slate-500 font-semibold mt-0.5">20+ Cars • Doorstep Delivery</p>
                </div>
            </button>

            <!-- Puri -->
            <button type="button" onclick="selectCity('Puri', 'Marine Drive, Puri')" class="city-item flex items-center gap-3.5 p-3.5 rounded-2xl border border-slate-200 dark:border-zinc-800 bg-slate-50/50 dark:bg-zinc-800/40 hover:border-[#FF5F00] transition-all text-left group">
                <div class="w-11 h-11 rounded-2xl bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined text-2xl">beach_access</span>
                </div>
                <div class="flex-1 min-w-0">
                    <h4 class="text-sm font-black text-slate-900 dark:text-white group-hover:text-[#FF5F00] transition-colors">Puri</h4>
                    <p class="text-[11px] text-slate-500 dark:text-zinc-400 font-medium truncate">Marine Drive • Grand Road • Puri Station</p>
                    <p class="text-[10px] text-slate-500 font-semibold mt-0.5">15+ Cars • Coastal Pilgrimage Fleet</p>
                </div>
            </button>

            <!-- Rourkela -->
            <button type="button" onclick="selectCity('Rourkela', 'Panposh, Rourkela')" class="city-item flex items-center gap-3.5 p-3.5 rounded-2xl border border-slate-200 dark:border-zinc-800 bg-slate-50/50 dark:bg-zinc-800/40 hover:border-[#FF5F00] transition-all text-left group">
                <div class="w-11 h-11 rounded-2xl bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined text-2xl">factory</span>
                </div>
                <div class="flex-1 min-w-0">
                    <h4 class="text-sm font-black text-slate-900 dark:text-white group-hover:text-[#FF5F00] transition-colors">Rourkela</h4>
                    <p class="text-[11px] text-slate-500 dark:text-zinc-400 font-medium truncate">Panposh • Sector 5 • Rourkela Junction</p>
                    <p class="text-[10px] text-slate-500 font-semibold mt-0.5">12+ Cars • Industrial Corridor</p>
                </div>
            </button>

            <!-- Sambalpur -->
            <button type="button" onclick="selectCity('Sambalpur', 'Ainthapali, Sambalpur')" class="city-item flex items-center gap-3.5 p-3.5 rounded-2xl border border-slate-200 dark:border-zinc-800 bg-slate-50/50 dark:bg-zinc-800/40 hover:border-[#FF5F00] transition-all text-left group">
                <div class="w-11 h-11 rounded-2xl bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined text-2xl">landscape</span>
                </div>
                <div class="flex-1 min-w-0">
                    <h4 class="text-sm font-black text-slate-900 dark:text-white group-hover:text-[#FF5F00] transition-colors">Sambalpur</h4>
                    <p class="text-[11px] text-slate-500 dark:text-zinc-400 font-medium truncate">Ainthapali • Burla VSSUT • Sambalpur Jn</p>
                    <p class="text-[10px] text-slate-500 font-semibold mt-0.5">10+ Cars • Western Odisha Hub</p>
                </div>
            </button>

            <!-- Berhampur -->
            <button type="button" onclick="selectCity('Berhampur', 'Gopalpur Junction, Berhampur')" class="city-item flex items-center gap-3.5 p-3.5 rounded-2xl border border-slate-200 dark:border-zinc-800 bg-slate-50/50 dark:bg-zinc-800/40 hover:border-[#FF5F00] transition-all text-left group">
                <div class="w-11 h-11 rounded-2xl bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined text-2xl">hub</span>
                </div>
                <div class="flex-1 min-w-0">
                    <h4 class="text-sm font-black text-slate-900 dark:text-white group-hover:text-[#FF5F00] transition-colors">Berhampur</h4>
                    <p class="text-[11px] text-slate-500 dark:text-zinc-400 font-medium truncate">Gopalpur Junction • Old Bus Stand • Berhampur Stn</p>
                    <p class="text-[10px] text-slate-500 font-semibold mt-0.5">8+ Cars • South Odisha Hub</p>
                </div>
            </button>

        </div>
    </div>
</div>

<script>
function openCityModal() {
    const overlay = document.getElementById('city-modal-overlay');
    const sheet = document.getElementById('city-modal-sheet');
    if (!overlay || !sheet) return;
    overlay.classList.remove('hidden');
    sheet.classList.remove('hidden');
    requestAnimationFrame(() => {
        overlay.classList.remove('opacity-0');
        sheet.classList.remove('translate-y-full', 'sm:translate-y-[-40%]');
        sheet.classList.add('translate-y-0', 'sm:translate-y-[-50%]');
    });
}

function closeCityModal() {
    const overlay = document.getElementById('city-modal-overlay');
    const sheet = document.getElementById('city-modal-sheet');
    if (!overlay || !sheet) return;
    overlay.classList.add('opacity-0');
    sheet.classList.remove('translate-y-0', 'sm:translate-y-[-50%]');
    sheet.classList.add('translate-y-full', 'sm:translate-y-[-40%]');
    setTimeout(() => {
        overlay.classList.add('hidden');
        sheet.classList.add('hidden');
    }, 300);
}

function selectCity(city, fullAddress) {
    // 1. Update UI labels across page
    document.querySelectorAll('.current-city-label').forEach(el => el.textContent = city);
    const locInput = document.getElementById('location-input') || document.getElementById('pickup-location-input');
    if (locInput) locInput.value = fullAddress || city;

    // Mark in localStorage that user has made/seen city selection
    localStorage.setItem('rentora_odisha_city_selected', city);

    closeCityModal();

    // 2. Persist to Django session
    function getCsrfToken() {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, 10) === 'csrftoken=') {
                    cookieValue = decodeURIComponent(cookie.substring(10));
                    break;
                }
            }
        }
        return cookieValue;
    }

    fetch('{% url "set_city" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCsrfToken(),
        },
        body: JSON.stringify({ city: city })
    }).then(res => res.json()).then(data => {
        // If user is currently filtering cars, reload with selected city query
        if (window.location.pathname.includes('/cars')) {
            const url = new URL(window.location);
            url.searchParams.set('location', city);
            window.location.href = url.toString();
        }
    }).catch(err => {
        console.error('Failed to save city selection:', err);
    });
}

function filterCityList(query) {
    const q = query.toLowerCase().trim();
    document.querySelectorAll('.city-item').forEach(item => {
        const text = item.textContent.toLowerCase();
        if (text.includes(q)) {
            item.classList.remove('hidden');
        } else {
            item.classList.add('hidden');
        }
    });
}

// Auto-prompt on first visit (like Zoomcar / Revv)
document.addEventListener('DOMContentLoaded', function() {
    const cityChosen = localStorage.getItem('rentora_odisha_city_selected');
    const isHomePage = window.location.pathname === '/' || window.location.pathname === '';
    if (!cityChosen && isHomePage) {
        // Subtle auto-open after page finishes entrance animation
        setTimeout(() => {
            openCityModal();
        }, 800);
    }
});
</script>
