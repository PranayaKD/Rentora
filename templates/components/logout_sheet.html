<!-- Logout Confirmation Sheet -->
<div id="logout-overlay" class="fixed inset-0 z-[200] bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300" onclick="closeLogoutSheet()"></div>

<div id="logout-sheet" class="fixed bottom-0 md:bottom-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 inset-x-0 md:inset-x-auto w-full max-w-sm mx-auto z-[210] hidden bg-white dark:bg-zinc-900 rounded-t-3xl md:rounded-3xl p-6 border-t md:border border-slate-200 dark:border-zinc-800 shadow-2xl translate-y-full md:translate-y-[-40%] transition-transform duration-300 ease-out flex flex-col">
    <!-- Drag Handle -->
    <div class="md:hidden w-12 h-1.5 bg-slate-300 dark:bg-zinc-700 rounded-full mx-auto mb-4 shrink-0 cursor-pointer" onclick="closeLogoutSheet()"></div>

    <div class="flex flex-col items-center text-center gap-2 mb-6">
        <div class="w-14 h-14 rounded-full bg-red-100 text-red-600 dark:bg-red-950/60 dark:text-red-400 flex items-center justify-center mb-1">
            <span class="material-symbols-outlined text-2xl font-bold">logout</span>
        </div>
        <h3 class="font-headline text-lg font-black text-slate-900 dark:text-white">Log Out of Rentora?</h3>
        <p class="text-xs text-slate-500 dark:text-zinc-400 max-w-xs font-medium">You can log back in anytime with your phone number and instant OTP.</p>
    </div>

    <!-- Actions -->
    <form action="{% url 'logout' %}" method="post" class="w-full flex flex-col gap-3">
        {% csrf_token %}
        <button type="submit" class="w-full min-h-[44px] rounded-2xl bg-red-600 hover:bg-red-700 text-white font-black text-xs uppercase tracking-wider flex items-center justify-center gap-1.5 shadow-md shadow-red-600/20 transition-all">
            <span>Log Out</span>
        </button>
        <button type="button" onclick="closeLogoutSheet()" class="w-full min-h-[44px] rounded-2xl bg-slate-100 dark:bg-zinc-800 text-slate-800 dark:text-zinc-200 hover:bg-slate-200 dark:hover:bg-zinc-700 font-bold text-xs uppercase tracking-wider flex items-center justify-center transition-all">
            <span>Cancel</span>
        </button>
    </form>
</div>

<script>
function openLogoutSheet() {
    const overlay = document.getElementById('logout-overlay');
    const sheet = document.getElementById('logout-sheet');
    if (!overlay || !sheet) return;
    overlay.classList.remove('hidden');
    sheet.classList.remove('hidden');
    setTimeout(() => {
        overlay.classList.remove('opacity-0');
        sheet.classList.remove('translate-y-full');
    }, 10);
}
function closeLogoutSheet() {
    const overlay = document.getElementById('logout-overlay');
    const sheet = document.getElementById('logout-sheet');
    if (!overlay || !sheet) return;
    overlay.classList.add('opacity-0');
    sheet.classList.add('translate-y-full');
    setTimeout(() => {
        overlay.classList.add('hidden');
        sheet.classList.add('hidden');
    }, 300);
}
</script>
