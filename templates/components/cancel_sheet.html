<!-- Rentora Cancel Booking Bottom Sheet (Stitch Design System) -->
<div id="cancel-overlay" class="sheet-backdrop fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300" onclick="closeCancelSheet()"></div>

<div id="cancel-sheet" class="sheet-panel fixed bottom-0 sm:bottom-auto sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 inset-x-0 sm:inset-x-auto w-full max-w-md mx-auto z-50 hidden bg-surface-container-lowest dark:bg-zinc-900 rounded-t-[2rem] sm:rounded-[2rem] p-6 sm:p-7 border border-outline-variant/30 dark:border-zinc-800 shadow-2xl translate-y-full sm:translate-y-[-40%] transition-all duration-300 ease-out flex flex-col relative">
    
    <!-- Mobile Drag Handle -->
    <div class="sm:hidden w-12 h-1.5 bg-outline-variant/40 dark:bg-zinc-700 rounded-full mx-auto mb-3 shrink-0 cursor-pointer" onclick="closeCancelSheet()"></div>

    <div class="flex items-center justify-between mb-4 pb-2 border-b border-surface-container-high dark:border-zinc-800">
        <div>
            <span class="text-[10px] font-black uppercase tracking-widest text-error">Trip Management</span>
            <h3 class="font-headline text-lg sm:text-xl font-black text-primary dark:text-white">Cancel Booking?</h3>
        </div>
        <button type="button" onclick="closeCancelSheet()" class="w-8 h-8 rounded-full bg-surface-container-low dark:bg-zinc-800 flex items-center justify-center text-on-surface-variant dark:text-zinc-400 hover:text-primary dark:hover:text-white transition-colors">
            <span class="material-symbols-outlined text-base">close</span>
        </button>
    </div>

    <!-- Booking Ref Pill -->
    <div class="p-3 bg-surface-container-low dark:bg-zinc-800 rounded-2xl mb-4 flex items-center justify-between border border-outline-variant/30">
        <span class="text-xs text-on-surface-variant dark:text-zinc-400 font-bold">Booking Reference</span>
        <span class="text-xs font-mono font-black text-primary dark:text-white">{{ booking.booking_reference }}</span>
    </div>

    <!-- Refund Line -->
    {% if refund_message %}
    <div class="p-3.5 bg-secondary-container/15 rounded-2xl mb-4 flex items-start gap-2.5 border border-secondary-container/30">
        <span class="material-symbols-outlined text-secondary text-base shrink-0 mt-0.5">info</span>
        <p class="text-xs text-primary dark:text-zinc-200 font-medium leading-relaxed">{{ refund_message }}</p>
    </div>
    {% endif %}

    <!-- Cancellation Form -->
    <form action="{% if booking.id %}{% url 'cancel_booking' booking.id %}{% else %}{{ cancel_url|default:'#' }}{% endif %}" method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-on-surface-variant dark:text-zinc-400 mb-2">Reason for Cancellation</label>
            <select name="reason" class="w-full bg-surface-container-low dark:bg-zinc-800 border border-outline-variant/40 dark:border-zinc-700 rounded-xl p-3 text-xs font-bold text-primary dark:text-white focus:outline-none focus:ring-2 focus:ring-secondary-container">
                <option value="plans_changed">Plans changed / Trip cancelled</option>
                <option value="booked_by_mistake">Booked by mistake</option>
                <option value="found_alternative">Found alternative ride</option>
                <option value="other">Other reason</option>
            </select>
        </div>

        <button type="submit" class="w-full py-3.5 rounded-2xl bg-error hover:bg-red-800 text-on-error font-black text-xs uppercase tracking-wider flex items-center justify-center gap-1.5 shadow-sm active:scale-[0.98] transition-all cursor-pointer">
            <span>Confirm Cancellation</span>
        </button>
        <button type="button" onclick="closeCancelSheet()" class="w-full py-3 rounded-2xl bg-surface-container-low hover:bg-surface-container dark:bg-zinc-800 dark:hover:bg-zinc-700 text-primary dark:text-zinc-200 font-bold text-xs uppercase tracking-wider flex items-center justify-center transition-all cursor-pointer border border-outline-variant/30">
            <span>Keep My Ride</span>
        </button>
    </form>
</div>

<script>
function openCancelSheet() {
    const overlay = document.getElementById('cancel-overlay');
    const sheet = document.getElementById('cancel-sheet');
    if (!overlay || !sheet) return;
    overlay.classList.remove('hidden');
    sheet.classList.remove('hidden');
    requestAnimationFrame(() => {
        overlay.classList.remove('opacity-0');
        sheet.classList.remove('translate-y-full', 'sm:translate-y-[-40%]');
        sheet.classList.add('translate-y-0', 'sm:translate-y-[-50%]');
    });
}
function closeCancelSheet() {
    const overlay = document.getElementById('cancel-overlay');
    const sheet = document.getElementById('cancel-sheet');
    if (!overlay || !sheet) return;
    overlay.classList.add('opacity-0');
    sheet.classList.remove('translate-y-0', 'sm:translate-y-[-50%]');
    sheet.classList.add('translate-y-full', 'sm:translate-y-[-40%]');
    setTimeout(() => {
        overlay.classList.add('hidden');
        sheet.classList.add('hidden');
    }, 300);
}
</script>
