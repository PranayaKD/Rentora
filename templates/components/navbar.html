{% load static %}
<!-- Stitch Executive Desktop & Mobile Navigation Bar -->
<header
  id="main-header"
  class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/90 backdrop-blur-xl border-b border-outline-variant/30 shadow-[0_1px_8px_rgba(0,0,0,0.04)] transition-all duration-300">
  <div class="header-inner-row h-16 lg:h-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-3 lg:gap-6 transition-all duration-300">

    <!-- Brand Logo & Odisha City Hub Selector -->
    <div class="flex items-center gap-3 lg:gap-5 shrink-0">
      <a class="flex items-center gap-2.5 group" href="{% url 'index' %}" aria-label="Rentora Home">
        <div
          class="w-8 h-8 lg:w-9 lg:h-9 rounded-xl overflow-hidden shrink-0 flex items-center justify-center group-hover:scale-105 transition-transform shadow-xs">
          <img src="{% static 'images/icon-512.png' %}" alt="Rentora" class="w-full h-full object-contain">
        </div>
        <span class="text-base lg:text-xl font-black tracking-tight text-primary font-headline">Rentora</span>
      </a>

      <div class="h-6 w-[1px] bg-surface-container-highest hidden sm:block"></div>

      <!-- Odisha City Selector Pill -->
      <button onclick="openCityModal()"
        class="flex items-center gap-1.5 lg:gap-2 px-3 lg:px-3.5 py-1.5 rounded-full bg-surface-container-low hover:bg-surface-container transition-colors text-left border border-outline-variant/30 group"
        type="button" title="Switch Odisha City/Hub">
        <span
          class="material-symbols-outlined text-primary text-[16px] lg:text-[18px] group-hover:text-secondary-container transition-colors">location_on</span>
        <div class="flex flex-col leading-tight">
          <span class="text-[9px] lg:text-[10px] uppercase font-bold text-primary tracking-wider flex items-center gap-1">
            <span class="relative flex h-1.5 w-1.5">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
            </span>
            <span>Hub</span>
          </span>
          <span class="text-xs text-primary font-extrabold flex items-center gap-0.5">
            <span class="current-city-label">{{ current_city|default:"Bhubaneswar" }}</span>
            <span class="material-symbols-outlined text-[14px] text-primary">keyboard_arrow_down</span>
          </span>
        </div>
      </button>
    </div>

    <!-- Center Desktop Navigation Capsule (Stitch Design Token) -->
    <nav
      class="hidden lg:flex items-center gap-1 bg-surface-container-low p-1.5 rounded-full border border-outline-variant/30 shadow-xs">
      <a href="{% url 'index' %}"
        class="px-4 py-2 rounded-full text-xs font-bold transition-all {% if active_tab == 'home' %}bg-primary text-white shadow-sm{% else %}text-slate-900 hover:text-black hover:bg-surface-container-highest{% endif %}">
        Explore
      </a>
      <a href="{% url 'cars' %}"
        class="px-4 py-2 rounded-full text-xs font-bold transition-all {% if active_tab == 'search' %}bg-primary text-white shadow-sm{% else %}text-slate-900 hover:text-black hover:bg-surface-container-highest{% endif %}">
        Fleet Catalog
      </a>
      <a href="{% url 'subscription' %}"
        class="px-4 py-2 rounded-full text-xs font-bold transition-all {% if active_tab == 'subscription' %}bg-primary text-white shadow-sm{% else %}text-slate-900 hover:text-black hover:bg-surface-container-highest{% endif %}">
        Subscriptions
      </a>
      <a href="{% url 'how_it_works' %}"
        class="px-4 py-2 rounded-full text-xs font-bold transition-all {% if active_tab == 'how_it_works' %}bg-primary text-white shadow-sm{% else %}text-slate-900 hover:text-black hover:bg-surface-container-highest{% endif %}">
        How It Works
      </a>
      <a href="{% url 'why_rentora' %}"
        class="px-4 py-2 rounded-full text-xs font-bold transition-all {% if active_tab == 'why_rentora' %}bg-primary text-white shadow-sm{% else %}text-slate-900 hover:text-black hover:bg-surface-container-highest{% endif %}">
        Why Rentora
      </a>
    </nav>

    <!-- Right User & Action Area -->
    <div class="flex items-center gap-2 lg:gap-3 shrink-0">
      {% if is_authenticated %}
      <a href="{% url 'dashboard_bookings' %}"
        class="hidden sm:flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-secondary-container/20 hover:bg-secondary-container/30 transition-colors text-xs font-bold text-on-surface border border-secondary-container/30">
        <span class="material-symbols-outlined text-[16px] text-secondary">calendar_today</span>
        <span>My Bookings</span>
      </a>

      <a href="{% url 'dashboard' %}"
        class="flex items-center gap-2 pl-1.5 pr-3 py-1 rounded-full bg-surface-container-low hover:bg-surface-container transition-colors border border-outline-variant/40 shadow-xs">
        <div class="w-7 h-7 rounded-full bg-primary text-on-primary flex items-center justify-center text-xs font-bold">
          {{ display_name|default:"U"|slice:":1"|upper }}
        </div>
        <span class="text-xs font-bold text-on-surface hidden md:inline">{{ display_name|default:"Account" }}</span>
      </a>

      <button type="button" onclick="openLogoutSheet()"
        class="hidden sm:flex items-center justify-center w-8 h-8 rounded-full text-on-surface-variant hover:text-error hover:bg-error-container/20 transition-colors"
        title="Sign Out">
        <span class="material-symbols-outlined text-[18px]">logout</span>
      </button>
      {% else %}
      <a href="{% url 'cars' %}"
        class="hidden sm:inline-flex text-xs font-bold text-on-surface-variant hover:text-on-surface transition-colors px-2.5 py-1.5">
        Explore Fleet
      </a>
      <button type="button" onclick="openMobileAuthModal('login')"
        class="flex items-center gap-1.5 px-4 lg:px-5 py-2 lg:py-2.5 rounded-full bg-primary text-on-primary hover:bg-primary-container text-xs font-bold shadow-sm transition-all hover:scale-105 active:scale-95">
        <span class="material-symbols-outlined text-[16px]">account_circle</span>
        <span>Sign In</span>
      </button>
      {% endif %}
    </div>

  </div>
</header>
<!-- Header Spacer so main content is never clipped behind the fixed header -->
<div class="h-16 lg:h-20 w-full shrink-0"></div>
