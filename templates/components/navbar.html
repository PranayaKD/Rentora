{% load static %}
<!-- Rentora Liquid Cool Glassmorphism Floating Navbar -->
<header
  id="main-header"
  class="fixed top-0 sm:top-2.5 left-0 right-0 z-50 px-2 sm:px-4 md:px-6 transition-all duration-300 pointer-events-none bg-transparent">
  <div class="max-w-7xl mx-auto">
    <div class="liquid-nav-glass pointer-events-auto rounded-2xl sm:rounded-full px-3.5 sm:px-6 h-16 sm:h-[70px] flex items-center justify-between gap-2.5 sm:gap-6 transition-all duration-300">

      <!-- Brand Logo & Odisha City Hub Selector -->
      <div class="flex items-center gap-2.5 sm:gap-4 shrink-0">
        <a class="flex items-center gap-2.5 group" href="{% url 'index' %}" aria-label="Rentora Home">
          <div
            class="w-8 h-8 sm:w-9 sm:h-9 shrink-0 flex items-center justify-center group-hover:scale-105 transition-transform">
            <img src="{% static 'images/icon-512-transparent.png' %}" alt="Rentora" class="w-full h-full object-contain">
          </div>
          <span class="text-lg sm:text-xl font-black tracking-tight text-primary font-headline">Rentora</span>
        </a>

        <div class="h-6 w-[1px] bg-black/10 hidden sm:block"></div>

        <!-- Quick-Commerce Style Hub & Location Selector (Liquid Pill) -->
        <button onclick="openCityModal()"
          class="liquid-hub-pill flex items-center gap-2 px-2.5 sm:px-3.5 py-1.5 rounded-xl sm:rounded-2xl hover:bg-surface-container transition-all text-left group max-w-[170px] sm:max-w-[260px] md:max-w-[300px] cursor-pointer"
          type="button" title="Select Delivery or Pickup Location in Odisha">
          <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-burnt-orange/15 text-burnt-orange flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
            <span class="material-symbols-outlined text-[18px] sm:text-[20px] text-burnt-orange">location_on</span>
          </div>
          <div class="flex flex-col min-w-0 leading-tight">
            <!-- Top Line: Hub name in bold with active indicator -->
            <div class="flex items-center gap-1.5">
              <span class="text-xs sm:text-[13px] font-black text-primary font-headline truncate current-hub-title">
                {{ current_city|default:"Bhubaneswar" }} Hub
              </span>
              <span class="relative flex h-1.5 w-1.5 shrink-0">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
              </span>
            </div>
            <!-- Bottom Line: Specific Location / Street with Down Arrow -->
            <div class="flex items-center gap-0.5 text-on-surface-variant">
              <span class="text-[10px] sm:text-[11px] font-semibold truncate max-w-[110px] sm:max-w-[190px] current-location-subtitle font-body">
                {{ pickup_location|default:"Patia, Bhubaneswar, Odisha" }}
              </span>
              <span class="material-symbols-outlined text-[13px] sm:text-[14px] text-primary shrink-0 group-hover:translate-y-0.5 transition-transform">keyboard_arrow_down</span>
            </div>
          </div>
        </button>
      </div>

      <!-- Center Desktop Navigation Capsule (Liquid Glass Style) -->
      <nav
        class="hidden lg:flex items-center gap-1 bg-black/[0.04] p-1.5 rounded-full border border-black/[0.06] shadow-xs">
        <a href="{% url 'index' %}"
          class="px-4 py-2 rounded-full text-xs font-bold font-body transition-all {% if active_tab == 'home' %}bg-primary text-white shadow-sm{% else %}text-primary/80 hover:text-primary hover:bg-black/5{% endif %}">
          Explore
        </a>
        <a href="{% url 'cars' %}"
          class="px-4 py-2 rounded-full text-xs font-bold font-body transition-all {% if active_tab == 'search' %}bg-primary text-white shadow-sm{% else %}text-primary/80 hover:text-primary hover:bg-black/5{% endif %}">
          Fleet Catalog
        </a>
        <a href="{% url 'subscription' %}"
          class="px-4 py-2 rounded-full text-xs font-bold font-body transition-all {% if active_tab == 'subscription' %}bg-primary text-white shadow-sm{% else %}text-primary/80 hover:text-primary hover:bg-black/5{% endif %}">
          Subscriptions
        </a>
        <a href="{% url 'how_it_works' %}"
          class="px-4 py-2 rounded-full text-xs font-bold font-body transition-all {% if active_tab == 'how_it_works' %}bg-primary text-white shadow-sm{% else %}text-primary/80 hover:text-primary hover:bg-black/5{% endif %}">
          How It Works
        </a>
        <a href="{% url 'why_rentora' %}"
          class="px-4 py-2 rounded-full text-xs font-bold font-body transition-all {% if active_tab == 'why_rentora' %}bg-primary text-white shadow-sm{% else %}text-primary/80 hover:text-primary hover:bg-black/5{% endif %}">
          Why Rentora
        </a>
      </nav>

      <!-- Right User & Action Area -->
      <div class="flex items-center gap-2 lg:gap-3 shrink-0">
        {% if is_authenticated %}
        <a href="{% url 'dashboard_bookings' %}"
          class="hidden sm:flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-secondary-container/20 hover:bg-secondary-container/30 transition-colors text-xs font-bold text-on-surface border border-secondary-container/30 font-body">
          <span class="material-symbols-outlined text-[16px] text-secondary">calendar_today</span>
          <span>My Bookings</span>
        </a>

        <a href="{% url 'dashboard' %}"
          class="flex items-center gap-2 pl-1.5 pr-3 py-1 rounded-full bg-cream/90 hover:bg-cream transition-colors border border-black/10 shadow-xs font-body">
          <div class="w-7 h-7 rounded-full bg-primary text-on-primary flex items-center justify-center text-xs font-bold">
            {{ display_name|default:"U"|slice:":1"|upper }}
          </div>
          <span class="text-xs font-bold text-on-surface hidden md:inline">{{ display_name|default:"Account" }}</span>
        </a>

        <button type="button" onclick="openLogoutSheet()"
          class="hidden sm:flex items-center justify-center w-8 h-8 rounded-full text-on-surface-variant hover:text-error hover:bg-error-container/20 transition-colors"
          title="Sign Out">
          <span class="material-symbols-outlined text-[18px]">logout</span>
        </button>
        {% else %}
        <a href="{% url 'cars' %}"
          class="hidden sm:inline-flex text-xs font-bold text-on-surface-variant hover:text-on-surface transition-colors px-2.5 py-1.5 font-body">
          Explore Fleet
        </a>
        <button type="button" onclick="openMobileAuthModal('login')"
          class="flex items-center gap-1.5 px-4 lg:px-5 py-2 lg:py-2.5 rounded-full bg-secondary-container hover:bg-[#c44714] text-white text-xs font-black shadow-sm transition-all hover:scale-105 active:scale-95 cursor-pointer font-body">
          <span class="material-symbols-outlined text-[16px]">account_circle</span>
          <span>Sign In</span>
        </button>
        {% endif %}
      </div>

    </div>
  </div>
</header>
<!-- Header Spacer so main content is never clipped behind the fixed header -->
<div class="h-20 lg:h-24 w-full shrink-0"></div>
