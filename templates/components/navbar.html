{% load static %}
<!-- Top Navigation -->
<header class="sticky top-0 z-[100] bg-white/95 dark:bg-background-dark/95 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <a href="{% url 'index' %}" class="navbar-logo flex items-center gap-2 text-primary dark:text-accent" aria-label="Rentora Home">
                <img src="{% static 'images/icon-512.png' %}" alt="Rentora Logo" class="size-8 object-contain">
                <span class="text-2xl font-extrabold tracking-tight text-primary dark:text-white">Rentora</span>
            </a>
        </div>
        <nav class="hidden md:flex items-center gap-8">
            <a class="text-sm font-semibold {% if request.resolver_match.url_name == 'index' %}text-accent{% else %}hover:text-accent{% endif %} transition-colors" href="{% url 'index' %}">Home</a>
            <a class="text-sm font-semibold {% if request.resolver_match.url_name == 'cars' %}text-accent{% else %}hover:text-accent{% endif %} transition-colors" href="{% url 'cars' %}">Cars</a>
            <a class="text-sm font-semibold {% if request.resolver_match.url_name == 'how_it_works' %}text-accent{% else %}hover:text-accent{% endif %} transition-colors" href="{% url 'how_it_works' %}">How it Works</a>
            <a class="text-sm font-semibold hover:text-accent transition-colors" href="{% url 'index' %}#contact">Contact</a>
        </nav>
        <div class="flex items-center gap-2 sm:gap-4">
            {% if user.is_authenticated %}
            <div class="flex items-center gap-2 sm:gap-6 mr-2 sm:mr-4">
                <a href="{% url 'dashboard' %}" class="flex items-center gap-2 text-sm font-bold {% if 'dashboard' in request.path %}text-accent{% else %}text-slate-500 hover:text-accent{% endif %} transition-colors">
                    <span class="material-symbols-outlined text-[1.25rem]">dashboard</span>
                    <span class="hidden lg:inline">Dashboard</span>
                </a>
                <a href="{% url 'wishlist' %}" class="relative text-slate-500 hover:text-red-500 transition-colors">
                    <span class="material-symbols-outlined text-[1.25rem]">favorite</span>
                </a>
                <a href="{% url 'notifications' %}" class="relative text-slate-500 hover:text-accent transition-colors" id="navbar-bell">
                    <span class="material-symbols-outlined text-[1.25rem]">notifications</span>
                    <span id="navbar-bell-badge" class="hidden absolute -top-1 -right-1 size-4 bg-accent text-white text-[10px] font-bold rounded-full flex items-center justify-center"></span>
                </a>
            </div>
            <a href="{% url 'logout' %}" class="bg-primary hover:bg-slate-800 text-white px-4 sm:px-6 py-2 rounded-full font-bold text-sm transition-all shadow-lg border border-slate-700">Logout</a>
            {% else %}
            <a href="{% url 'login' %}" class="bg-accent hover:bg-accent/90 text-white px-4 sm:px-6 py-2 rounded-full font-bold text-sm transition-all shadow-lg shadow-accent/20">Sign In</a>
            {% endif %}
        </div>
    </div>
</header>
