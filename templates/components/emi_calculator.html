<!-- EMI Calculator Modal -->
<div id="emiModal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center">
    <div class="bg-white dark:bg-slate-900 w-full max-w-md mx-4 rounded-[2rem] shadow-2xl overflow-hidden border border-slate-100 dark:border-slate-800 translate-y-4 opacity-0 transition-all duration-300 transform scale-95 data-[open=true]:translate-y-0 data-[open=true]:opacity-100 data-[open=true]:scale-100" id="emiModalContent">
        <div class="p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black text-slate-900 dark:text-white">EMI Calculator</h3>
                <button onclick="closeEmiCalculator()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors">
                    <span class="material-symbols-outlined text-lg">close</span>
                </button>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Loan Amount (₹)</label>
                    <input type="number" id="emiAmount" value="500000" class="w-full bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-xl py-3 px-4 text-sm focus:ring-2 focus:ring-accent focus:border-accent text-slate-900 dark:text-white transition-all outline-none" oninput="calculateEMI()">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Interest (% p.a.)</label>
                        <input type="number" id="emiRate" value="9.5" step="0.1" class="w-full bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-xl py-3 px-4 text-sm focus:ring-2 focus:ring-accent focus:border-accent text-slate-900 dark:text-white transition-all outline-none" oninput="calculateEMI()">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Tenure (Years)</label>
                        <input type="number" id="emiTenure" value="5" class="w-full bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-xl py-3 px-4 text-sm focus:ring-2 focus:ring-accent focus:border-accent text-slate-900 dark:text-white transition-all outline-none" oninput="calculateEMI()">
                    </div>
                </div>
                
                <div class="pt-6 mt-6 border-t border-slate-100 dark:border-slate-800">
                    <p class="text-center text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Estimated Monthly EMI</p>
                    <div class="text-4xl font-black text-accent text-center tracking-tight" id="emiResult">₹10,501</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function openEmiCalculator() {
        const modal = document.getElementById('emiModal');
        const content = document.getElementById('emiModalContent');
        modal.classList.remove('hidden');
        // Small delay to allow display:block to apply before animating opacity
        setTimeout(() => {
            content.setAttribute('data-open', 'true');
        }, 10);
        calculateEMI();
    }
    
    function closeEmiCalculator() {
        const modal = document.getElementById('emiModal');
        const content = document.getElementById('emiModalContent');
        content.removeAttribute('data-open');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300); // Wait for transition
    }

    function calculateEMI() {
        const P = parseFloat(document.getElementById('emiAmount').value);
        const R = parseFloat(document.getElementById('emiRate').value) / 12 / 100;
        const N = parseFloat(document.getElementById('emiTenure').value) * 12;
        
        let emi = 0;
        if (P && R && N) {
            emi = P * R * (Math.pow(1 + R, N) / (Math.pow(1 + R, N) - 1));
        } else if (P && N && R === 0) {
            emi = P / N;
        }
        
        document.getElementById('emiResult').textContent = 
            emi > 0 ? '₹' + Math.round(emi).toLocaleString('en-IN') : '₹0';
    }
</script>
